# Primary way to run this repo -- see README "Quick start". Replaces the
# network create / docker run / docker cp block in the README's manual
# setup section (kept there as a documented fallback, not the main path).
#
# `command:` on each service also rebuilds what run_live_demo.sh used to do
# from the host via `docker exec` (see scripts/compose_*_entry.sh) -- so
# unlike the Dockerfile's own idle `tail -f /dev/null` CMD, `docker compose
# up` here goes straight into the live SLAC+HLC MITM run: tcpdump starts in
# each container, then each container's *_run_full.sh, with output shown
# live, labeled/colored per-service by compose itself. Ctrl-C (or
# `docker compose down`) stops tcpdump with SIGINT first, for a clean pcap
# trailer, same as run_live_demo.sh's own cleanup().
#
# Usage:
#   EVCC_MODE=tls TAMPER=1 docker compose up --build   # tamper only takes
#                                                       # effect in notls
#   DEBUG=1 docker compose up --build   # print decoded EXI as messages are
#                                        # relayed (off by default -- see
#                                        # README "Content tampering")
#   ./scripts/regen_certs.sh   # still separate: it execs create_certs.sh
#                               # inside SECC, not a static file copy
#
#   # ISO 15118-20 (split profile only -- see README "Split proxy"):
#   EVCC_MODE=iso20 docker compose --profile split up --build \
#     SECC EVCC Evil_SECC Evil_EVCC
#   # Runs plaintext by default (the pinned iso15118 stack's own -20
#   # example config sets useTls: false -- not something this repo
#   # controls). ENABLE_TLS_1_3=true (set here so it reaches all four
#   # services below) plus your own useTls:true config would be needed for
#   # a genuinely TLS-protected -20 run -- see README for the full story.
#
#   # EVExchange cross-session relay (evexchange profile only -- see
#   # README "EVExchange cross-session relay" and evexchange_attack.pdf):
#   docker compose --profile evexchange up --build \
#     SECC EVCC SECC_Attacker EVCC_Attacker Dev1 Dev2
#   # ATTACKER_STOP_AFTER_S=30 (on Dev2) cuts the attacker's relayed
#   # session short after 30s, to reproduce the paper's billing asymmetry
#   # without manual timing -- best-effort, verify against a real run.
#
# Pcaps/logs land directly in ./captures on the host (bind-mounted), so no
# docker cp step is needed afterwards either.
#
# To get the old idle-container shell instead (e.g. for manual/interactive
# use): `docker compose run --rm --entrypoint /bin/bash SECC`.
#
# Bind-mounted scripts keep the host's execute bit (Linux bind mounts
# preserve host file mode), so the old `chmod +x` docker exec calls aren't
# needed here.

x-proxy-build: &proxy-build
  context: .
  dockerfile: docker/Dockerfile.proxytest

services:
  SECC:
    build: *proxy-build
    image: proxy-proxy
    container_name: SECC
    tty: true
    stdin_open: true
    command: /usr/src/app/compose_secc_entry.sh
    environment:
      ENABLE_TLS_1_3: ${ENABLE_TLS_1_3:-false}   # optional -- see EVCC_MODE=iso20 below
    networks:
      - proxy_net1
    volumes:
      - ./scripts/secc_run_full.sh:/usr/src/app/secc_run_full.sh:ro
      - ./scripts/compose_secc_entry.sh:/usr/src/app/compose_secc_entry.sh:ro
      - ./captures:/captures

  EVCC:
    build: *proxy-build
    image: proxy-proxy
    container_name: EVCC
    tty: true
    stdin_open: true
    command: /usr/src/app/compose_evcc_entry.sh
    environment:
      EVCC_MODE: ${EVCC_MODE:-tls}   # tls (default), notls, or iso20
      ENABLE_TLS_1_3: ${ENABLE_TLS_1_3:-false}   # optional -- genuine TLS 1.3 +
                                             # mutual-auth -20 behavior; set
                                             # on SECC/Evil_SECC/Evil_EVCC too
    networks:
      - proxy_net2
    volumes:
      - ./scripts/evcc_run_full.sh:/usr/src/app/evcc_run_full.sh:ro
      - ./scripts/compose_evcc_entry.sh:/usr/src/app/compose_evcc_entry.sh:ro
      - ./captures:/captures

  Evil_EVSE_Evil_PEV:
    build: *proxy-build
    image: proxy-proxy
    container_name: Evil_EVSE_Evil_PEV
    tty: true
    stdin_open: true
    command: /usr/src/app/compose_proxy_entry.sh
    environment:
      TAMPER: ${TAMPER:-}   # 1 = tamper EVSEMaxCurrent (notls sessions only)
      DEBUG: ${DEBUG:-}     # 1 = print decoded EXI as messages are relayed
    networks:        # dual-homed: proxy_net1 (SECC-facing) + proxy_net2 (EVCC-facing)
      - proxy_net1
      - proxy_net2
    volumes:
      - ./proxy/proxy01.py:/usr/src/app/iso15118/proxy01.py:ro
      - ./proxy/common.py:/usr/src/app/iso15118/common.py:ro
      - ./scripts/proxy_run_full.sh:/usr/src/app/proxy_run_full.sh:ro
      - ./scripts/compose_proxy_entry.sh:/usr/src/app/compose_proxy_entry.sh:ro
      - ./captures:/captures

  # --- "split" profile: the two-fake-endpoint MITM (Evil_SECC + Evil_EVCC),
  # an alternative to Evil_EVSE_Evil_PEV above -- not started by a plain
  # `docker compose up` (no profiles: key there), only via
  # `docker compose --profile split up SECC EVCC Evil_SECC Evil_EVCC`.
  # See README "Split proxy (Evil_SECC + Evil_EVCC)". Don't run this
  # alongside Evil_EVSE_Evil_PEV against the same SECC/EVCC -- both would
  # try to answer the same SDP/SLAC requests.
  Evil_SECC:
    build: *proxy-build
    image: proxy-proxy
    container_name: Evil_SECC
    tty: true
    stdin_open: true
    profiles: ["split"]
    command: /usr/src/app/compose_evil_secc_entry.sh
    environment:
      ENABLE_TLS_1_3: ${ENABLE_TLS_1_3:-false}   # optional -- see EVCC_MODE=iso20 on EVCC
      DEBUG: ${DEBUG:-}     # 1 = print decoded EVCC->SECC EXI as it's relayed
    networks:        # proxy_net2 (EVCC-facing) + bridge_net (Evil_EVCC only)
      - proxy_net2
      - bridge_net
    volumes:
      - ./proxy/evil_secc.py:/usr/src/app/iso15118/evil_secc.py:ro
      - ./proxy/common.py:/usr/src/app/iso15118/common.py:ro
      - ./scripts/evil_secc_run_full.sh:/usr/src/app/evil_secc_run_full.sh:ro
      - ./scripts/compose_evil_secc_entry.sh:/usr/src/app/compose_evil_secc_entry.sh:ro
      - ./captures:/captures

  Evil_EVCC:
    build: *proxy-build
    image: proxy-proxy
    container_name: Evil_EVCC
    tty: true
    stdin_open: true
    profiles: ["split"]
    command: /usr/src/app/compose_evil_evcc_entry.sh
    environment:
      TAMPER: ${TAMPER:-}   # 1 = tamper EVSEMaxCurrent -- works in TLS/PnC
                             # and ISO 15118-20 too here, unlike the
                             # single-relay proxy's notls-only tamper.
      ENABLE_TLS_1_3: ${ENABLE_TLS_1_3:-false}   # optional -- see EVCC_MODE=iso20 on EVCC
      DEBUG: ${DEBUG:-}     # 1 = print decoded SECC->EVCC EXI as it's relayed
    networks:        # proxy_net1 (SECC-facing) + bridge_net (Evil_SECC only)
      - proxy_net1
      - bridge_net
    volumes:
      - ./proxy/evil_evcc.py:/usr/src/app/iso15118/evil_evcc.py:ro
      - ./proxy/common.py:/usr/src/app/iso15118/common.py:ro
      - ./scripts/evil_evcc_run_full.sh:/usr/src/app/evil_evcc_run_full.sh:ro
      - ./scripts/compose_evil_evcc_entry.sh:/usr/src/app/compose_evil_evcc_entry.sh:ro
      - ./captures:/captures

  # --- "evexchange" profile: the actual EVExchange cross-session relay
  # attack from the paper (Conti et al. -- see evexchange_attack.pdf),
  # distinct from both Evil_EVSE_Evil_PEV and the split proxy above. Needs
  # a *second* full real EV/EVSE pair (SECC_Attacker/EVCC_Attacker,
  # alongside the existing SECC/EVCC as the victim's pair) plus two blind
  # relay devices (Dev1/Dev2) that cross-wire the two sessions. See README
  # "EVExchange cross-session relay". Not started by a plain
  # `docker compose up`, nor by `--profile split` -- only via
  # `docker compose --profile evexchange up SECC EVCC SECC_Attacker EVCC_Attacker Dev1 Dev2`.
  # Don't run this alongside Evil_EVSE_Evil_PEV or Evil_SECC/Evil_EVCC
  # against the same SECC/EVCC -- all of them would try to answer the same
  # SDP/SLAC requests.
  SECC_Attacker:
    build: *proxy-build
    image: proxy-proxy
    container_name: SECC_Attacker
    tty: true
    stdin_open: true
    profiles: ["evexchange"]
    command: /usr/src/app/compose_secc_b_entry.sh
    networks:
      - proxy_net3
    volumes:
      - ./scripts/secc_b_run_full.sh:/usr/src/app/secc_b_run_full.sh:ro
      - ./scripts/compose_secc_b_entry.sh:/usr/src/app/compose_secc_b_entry.sh:ro
      - ./captures:/captures

  EVCC_Attacker:
    build: *proxy-build
    image: proxy-proxy
    container_name: EVCC_Attacker
    tty: true
    stdin_open: true
    profiles: ["evexchange"]
    command: /usr/src/app/compose_evcc_attacker_entry.sh
    environment:
      EVCC_MODE: ${EVCC_MODE:-tls}   # tls (default), notls, or iso20 -- same as EVCC
    networks:
      - proxy_net4
    volumes:
      - ./scripts/evcc_attacker_run_full.sh:/usr/src/app/evcc_attacker_run_full.sh:ro
      - ./scripts/compose_evcc_attacker_entry.sh:/usr/src/app/compose_evcc_attacker_entry.sh:ro
      - ./captures:/captures

  Dev1:
    build: *proxy-build
    image: proxy-proxy
    container_name: Dev1
    tty: true
    stdin_open: true
    profiles: ["evexchange"]
    command: /usr/src/app/compose_dev1_entry.sh
    networks:        # proxy_net1 (victim's SECC) + proxy_net2 (victim's EVCC) + relay_link (Dev2 only)
      - proxy_net1
      - proxy_net2
      - relay_link
    volumes:
      - ./proxy/dev_relay.py:/usr/src/app/iso15118/dev_relay.py:ro
      - ./proxy/common.py:/usr/src/app/iso15118/common.py:ro
      - ./scripts/dev1_run_full.sh:/usr/src/app/dev1_run_full.sh:ro
      - ./scripts/compose_dev1_entry.sh:/usr/src/app/compose_dev1_entry.sh:ro
      - ./captures:/captures

  Dev2:
    build: *proxy-build
    image: proxy-proxy
    container_name: Dev2
    tty: true
    stdin_open: true
    profiles: ["evexchange"]
    command: /usr/src/app/compose_dev2_entry.sh
    environment:
      ATTACKER_STOP_AFTER_S: ${ATTACKER_STOP_AFTER_S:-}   # optional -- see dev_relay.py;
                             # cuts the attacker's relayed session short to
                             # produce the paper's billing asymmetry. Read
                             # directly by dev_relay.py (plain os.environ,
                             # not environs), so empty/unset is safe here.
    networks:        # proxy_net3 (attacker's SECC) + proxy_net4 (attacker's EVCC) + relay_link (Dev1 only)
      - proxy_net3
      - proxy_net4
      - relay_link
    volumes:
      - ./proxy/dev_relay.py:/usr/src/app/iso15118/dev_relay.py:ro
      - ./proxy/common.py:/usr/src/app/iso15118/common.py:ro
      - ./scripts/dev2_run_full.sh:/usr/src/app/dev2_run_full.sh:ro
      - ./scripts/compose_dev2_entry.sh:/usr/src/app/compose_dev2_entry.sh:ro
      - ./captures:/captures

networks:
  proxy_net1:
    name: proxy_net1
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.20.0.0/16
        - subnet: 2001:db8:1::/64

  proxy_net2:
    name: proxy_net2
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.19.0.0/16
        - subnet: 2001:db8:2::/64

  # Private control/data channel between Evil_SECC and Evil_EVCC only --
  # neither real SECC nor real EVCC is ever attached to this network, same
  # "never share a segment" property proxy_net1/proxy_net2 already have for
  # the real endpoints. No IPv6/link-local requirement here (nothing
  # HomePlug/SLAC-related crosses it, just the JSON control/relay protocol
  # in proxy/common.py), and `internal: true` additionally blocks this
  # network from reaching anything outside the Docker host.
  bridge_net:
    name: bridge_net
    internal: true
    ipam:
      config:
        - subnet: 172.25.0.0/24

  # --- "evexchange" profile networks -- the attacker's own real EV/EVSE
  # pair (proxy_net3/proxy_net4, mirroring proxy_net1/proxy_net2) plus the
  # private link between Dev1 and Dev2. Subnets picked clear of what was
  # observed in use on the dev host this session (172.17-172.25) -- same
  # caveat as bridge_net: check `docker network ls` against your own host
  # before creating these, that range can differ.
  proxy_net3:
    name: proxy_net3
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.29.0.0/16
        - subnet: 2001:db8:4::/64

  proxy_net4:
    name: proxy_net4
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.30.0.0/16
        - subnet: 2001:db8:5::/64

  # Private link between Dev1 and Dev2 only -- no real EV/EVSE ever
  # attached, same isolation property as bridge_net.
  relay_link:
    name: relay_link
    internal: true
    ipam:
      config:
        - subnet: 172.31.0.0/24
